# OnePlus Ace 3 Pro 设备档案
#
# 机型：OnePlus Ace 3 Pro（国行） 型号 PJX110 代号 corvette
# 平台：Qualcomm SM8650-AB Snapdragon 8 Gen 3 / Adreno 750 / 4 KiB 页
# 出厂：ColorOS 14（Android 14），KMI = android14-6.1
#
# 内核核验结果（来自真机 uname -r / 系统信息页）：
#   6.1.57-android14-11-o-gfc2eac419e6e
# "-o-" 表示 OPlus 私有改动，所以这不是纯 GKI 内核：
# 厂商在 GKI 基线上加了自己的调度/内存模块，但 kABI 与 android14-6.1 对齐。

name=OnePlus Ace 3 Pro
model=PJX110
codename=corvette
platform=sm8650
kmi=android14-6.1
kernel_family=6.1

# 已知的原厂 release，仅作默认值；OTA 之后 hash 会变，务必以真机 uname -r 为准
known_release=6.1.57-android14-11-o-gfc2eac419e6e

# 安装后写入 config.conf 的默认值
#   compat=off    6.1 分支不产出 droid_lkm_vendor.ko，厂商兼容层只做 6.6/6.12
#   ghost=0       同上，ghost 任务回退由 vendor 模块提供，没有就关掉
#   selinux_fix=1 OPlus 默认策略对 su 域 module_load 是拒绝的，先开自动放行
#   inline_hook=1 PID/IPC namespace 的入口替换依赖 inline hook
conf_compat=off
conf_ghost=0
conf_selinux_fix=1
conf_inline_hook=1
