# OnePlus Ace 3 Pro 设备档案
#
# 机型：OnePlus Ace 3 Pro（国行） 型号 PJX110 代号 corvette
# 平台：Qualcomm SM8650-AB Snapdragon 8 Gen 3 / Adreno 750 / 4 KiB 页
# 系统：ColorOS 16（Android 16），固件 PJX110_16.0.5.701
# KMI：android14-6.1（6.1 这条线只有 android14 KMI，系统升大版本也不变）
#
# 内核：6.1.141 + OPlus 私有改动（uname 里带 "-o-"）。
# 厂商在 GKI 基线上加了自己的调度/内存模块，但 kABI 仍与 android14-6.1 对齐。
#
# 关于 vermagic：本模块带 __versions 段（CONFIG_MODVERSIONS=y），内核只比较
# 第一个空格之后那截 flag，release 里的版本号和 hash 不参与比较，
# 所以通用 android14-6.1 构建可以直接用，不需要按 uname -r 钉死。
# 详见 docs/pjx110.md 第 3 节。

name=OnePlus Ace 3 Pro
model=PJX110
codename=corvette
platform=sm8650
kmi=android14-6.1
kernel_family=6.1
kernel_version=6.1.141
system_version=ColorOS 16 / PJX110_16.0.5.701

# 完整 release 留空：不知道 hash，而且内核不比较它。
# 只有遇到走完整字符串比较的内核时才需要填，格式：
#   known_release=6.1.141-android14-11-o-gxxxxxxxxxxx
known_release=

# 安装后写入 config.conf 的默认值
#   compat=off    6.1 分支不产出 droid_lkm_vendor.ko，厂商兼容层只做 6.6/6.12
#   ghost=0       同上，ghost 任务回退由 vendor 模块提供，没有就关掉
#   selinux_fix=1 OPlus 默认策略对 su 域 module_load 是拒绝的，先开自动放行
#   inline_hook=1 PID/IPC namespace 的入口替换依赖 inline hook
conf_compat=off
conf_ghost=0
conf_selinux_fix=1
conf_inline_hook=1
